# ntfy — self-hosted push notification server, accessed privately at
# https://ntfy.<tailnet>.ts.net (tailnet-only; no host port, no public route).
#
# This is the notification delivery endpoint for dsh-notify (and optional
# deploy-agent webhook notifications). It is a STATIC infra service: it uses
# the off-the-shelf `binwiederhier/ntfy` image, so no project repo builds it and
# no project webhook deploys it. On the server, bring it up with:
#
#   git pull
#   docker compose -f services/ntfy/docker-compose.yml up -d
#
# Like the other per-app services, it gets its own Tailscale sidecar, so the
# MagicDNS hostname below is what the tailnet resolves. Copy `.env.example` to
# `.env` and at minimum set `TS_AUTHKEY` (and the tailnet-specific
# `NTFY_BASE_URL` / `NTFY_BEHIND_PROXY`) — see docs/ntfy.md.
#
# Topic access is OPEN (no access control configured): any peer that can reach
# the host over the tailnet can publish/subscribe. The only access boundary is
# tailnet membership — so keep the sidecar's `AllowFunnel` off and don't
# publish a host port. To lock it down, configure ntfy auth and give DSH a
# bearer token (NTFY_TOKEN).

services:
  ntfy:
    image: binwiederhier/ntfy:latest
    # The image's default command does NOT start the server (bare `ntfy` prints
    # help). `serve` is required; config comes from the NTFY_* env vars in .env
    # (NTFY_BASE_URL / NTFY_BEHIND_PROXY / NTFY_LISTEN). It listens on :80 by
    # default, which is what the sidecar proxies to.
    command: serve
    restart: unless-stopped
    env_file: .env
    networks:
      - proxy
    expose:
      - "80" # ntfy serve listens on :80 by default; the sidecar proxies to it
    volumes:
      - ntfy-data:/var/lib/ntfy # cache.db + attachments (survive restarts)

  tailscale:
    image: tailscale/tailscale:latest
    hostname: ${TS_HOSTNAME:-ntfy} # MagicDNS: ntfy.<tailnet>.ts.net
    restart: unless-stopped
    environment:
      - TS_AUTHKEY=${TS_AUTHKEY}
      - TS_STATE_DIR=/var/lib/tailscale
      - TS_SERVE_CONFIG=/config/serve.json
      - TS_USERSPACE=false
      - TS_ENABLE_HEALTH_CHECK=true
      - TS_LOCAL_ADDR_PORT=127.0.0.1:41234
      - TS_AUTH_ONCE=true
    configs:
      - source: ts-serve
        target: /config/serve.json
    volumes:
      - ts-state:/var/lib/tailscale # persists the node identity across restarts
    devices:
      - /dev/net/tun:/dev/net/tun
    cap_add:
      - net_admin
    networks:
      - proxy
    depends_on:
      - ntfy
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:41234/healthz"]
      interval: 1m
      timeout: 10s
      retries: 3
      start_period: 10s

# Serve config: terminate HTTPS on the tailnet :443 and proxy to the ntfy app.
# `${TS_CERT_DOMAIN}` is filled in by the container at runtime (the MagicDNS FQDN).
configs:
  ts-serve:
    content: |
      {"TCP":{"443":{"HTTPS":true}},
       "Web":{"$${TS_CERT_DOMAIN}:443":{"Handlers":{"/":{"Proxy":"http://ntfy:80"}}}},
       "AllowFunnel":{"$${TS_CERT_DOMAIN}:443":false}}

networks:
  proxy:
    external: true

volumes:
  ntfy-data:
  ts-state:

# Deploy config for the personal-finance app (Next.js on container port 3000).
# Private access via Tailscale: binds loopback only; `tailscale serve` on the
# server proxies https://<machine>.<tailnet>.ts.net -> 127.0.0.1:3001.
services:
  personal-finance:
    image: ghcr.io/kegenguyll/personal-finance:${TAG}
    restart: unless-stopped
    env_file: .env
    networks:
      - proxy
    ports:
      - "127.0.0.1:3001:3000" # loopback only — Tailscale Serve proxies to this
    # healthcheck:
    #   test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/"]
    #   interval: 30s
    #   timeout: 5s
    #   retries: 3

networks:
  proxy:
    external: true

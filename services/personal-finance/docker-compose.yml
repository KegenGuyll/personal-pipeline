# personal-finance: Next.js app (container port 3000), accessed privately via a
# per-app Tailscale sidecar -> https://finance.<tailnet>.ts.net (no public route).
services:
  personal-finance:
    image: ghcr.io/kegenguyll/personal-finance:${TAG}
    restart: unless-stopped
    env_file: .env
    networks:
      - proxy
    expose:
      - "3000"

  tailscale:
    image: tailscale/tailscale:latest
    hostname: ${TS_HOSTNAME:-finance} # MagicDNS: finance.<tailnet>.ts.net
    restart: unless-stopped
    environment:
      - TS_AUTHKEY=${TS_AUTHKEY}
      - TS_STATE_DIR=/var/lib/tailscale
      - TS_SERVE_CONFIG=/config/serve.json
      - TS_USERSPACE=false
      - TS_ENABLE_HEALTH_CHECK=true
      - TS_LOCAL_ADDR_PORT=127.0.0.1:41234
      - TS_AUTH_ONCE=true
    configs:
      - source: ts-serve
        target: /config/serve.json
    volumes:
      - ts-state:/var/lib/tailscale
    devices:
      - /dev/net/tun:/dev/net/tun
    cap_add:
      - net_admin
    networks:
      - proxy
    depends_on:
      - personal-finance
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:41234/healthz"]
      interval: 1m
      timeout: 10s
      retries: 3
      start_period: 10s

configs:
  ts-serve:
    content: |
      {"TCP":{"443":{"HTTPS":true}},
       "Web":{"$${TS_CERT_DOMAIN}:443":{"Handlers":{"/":{"Proxy":"http://personal-finance:3000"}}}},
       "AllowFunnel":{"$${TS_CERT_DOMAIN}:443":false}}

networks:
  proxy:
    external: true

volumes:
  ts-state:

# Copy this whole directory to services/<name>/ and adjust:
#   1. the service key `app`  -> your service name (must be unique on the
#      `proxy` network; nginx will use it as the upstream hostname)
#   2. the image              -> ghcr.io/<owner>/<service>:${TAG}
#                                 (owner LOWERCASE — GHCR requires it)
#   3. the exposed port       -> the port your app listens on
# `${TAG}` is written by the deploy agent into this directory's `.env`.

services:
  app: # RENAME to your service name
    image: ghcr.io/YOUR_OWNER/YOUR_SERVICE:${TAG}
    restart: unless-stopped
    env_file: .env
    networks:
      - proxy
    expose:
      - "8080" # dockerized nginx: internal only (service alias on `proxy`)
    # Host nginx? Replace `expose` with a loopback port, e.g.:
    # ports:
    #   - "127.0.0.1:8080:8080"   # unique host port per service

networks:
  proxy:
    external: true

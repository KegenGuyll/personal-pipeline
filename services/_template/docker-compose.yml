# Copy this directory to services/<name>/ and adjust:
#   1. the service key `app` -> your service name (unique on the `proxy` network)
#   2. the image             -> ghcr.io/<owner>/<service>:${TAG}  (owner LOWERCASE)
#   3. the port              -> the port your app listens on (default 3000)
# `${TAG}` is written by the deploy agent into this directory's `.env`.
#
# Access model — choose ONE (see docs/adding-a-service.md):
#   • Private (Tailscale — recommended for anything with personal data):
#     publish a LOOPBACK port and front it with `tailscale serve`
#     (docs/tailscale.md). Only your tailnet can reach it.
#   • Public (NPM/nginx): publish a port NPM can reach and add a proxy host.

services:
  app: # RENAME to your service name
    image: ghcr.io/YOUR_OWNER/YOUR_SERVICE:${TAG}
    restart: unless-stopped
    env_file: .env
    networks:
      - proxy
    ports:
      - "127.0.0.1:3001:3000" # private (Tailscale): loopback only
    # public (NPM/nginx) instead?
    #   - "3001:3000"

networks:
  proxy:
    external: true

# Copy this directory to services/<name>/ and adjust:
#   1. service key `app` -> your service name (unique on the `proxy` network);
#      update BOTH the service key and the `Proxy` target in `ts-serve` below.
#   2. image             -> ghcr.io/<owner>/<service>:${TAG}  (owner LOWERCASE)
#   3. port              -> the app's container port (default 3000)
#   4. hostname          -> the MagicDNS name: https://<hostname>.<tailnet>.ts.net
# `${TAG}` is written by the deploy agent into this directory's `.env`.
#
# Access: per-app Tailscale sidecar (private). No host port, no public exposure.
# Set `TS_AUTHKEY` (and optional `TS_HOSTNAME`) in this service's SERVICE_ENV
# GitHub secret. See docs/tailscale.md.

services:
  app: # RENAME to your service name (also update the Proxy URL in `ts-serve`)
    image: ghcr.io/YOUR_OWNER/YOUR_SERVICE:${TAG}
    restart: unless-stopped
    env_file: .env
    networks:
      - proxy
    expose:
      - "3000" # the app's port, reached by the sidecar over `proxy`

  tailscale:
    image: tailscale/tailscale:latest
    hostname: ${TS_HOSTNAME:-YOUR_HOSTNAME} # MagicDNS: <hostname>.<tailnet>.ts.net
    restart: unless-stopped
    environment:
      - TS_AUTHKEY=${TS_AUTHKEY}
      - TS_STATE_DIR=/var/lib/tailscale
      - TS_SERVE_CONFIG=/config/serve.json
      - TS_USERSPACE=false
      - TS_ENABLE_HEALTH_CHECK=true
      - TS_LOCAL_ADDR_PORT=127.0.0.1:41234
      - TS_AUTH_ONCE=true
    configs:
      - source: ts-serve
        target: /config/serve.json
    volumes:
      - ts-state:/var/lib/tailscale # persists the node identity across restarts
    devices:
      - /dev/net/tun:/dev/net/tun
    cap_add:
      - net_admin
    networks:
      - proxy
    depends_on:
      - app
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:41234/healthz"]
      interval: 1m
      timeout: 10s
      retries: 3
      start_period: 10s

# Serve config: terminate HTTPS on the tailnet :443 and proxy to the app.
# `${TS_CERT_DOMAIN}` is filled in by the container at runtime (the MagicDNS FQDN).
configs:
  ts-serve:
    content: |
      {"TCP":{"443":{"HTTPS":true}},
       "Web":{"$${TS_CERT_DOMAIN}:443":{"Handlers":{"/":{"Proxy":"http://app:3000"}}}},
       "AllowFunnel":{"$${TS_CERT_DOMAIN}:443":false}}

networks:
  proxy:
    external: true

volumes:
  ts-state:

# DeepSeek Harness web server — private access at https://dsh.<tailnet>.ts.net
# (tailnet-only; no host port, no public route).
#
# Two deliberate deviations from services/_template (keep both, they are
# required by dsh web):
#   1. The `dsh` container shares the tailscale sidecar's network namespace
#      (`network_mode: service:tailscale`) instead of `expose` + proxy-network.
#      `dsh web` refuses --host 0.0.0.0 (upstream safety guard) and binds
#      127.0.0.1 by design; sharing the netns makes that loopback local to
#      the sidecar so it can be proxied.
#   2. ts-serve therefore proxies to http://127.0.0.1:3080 on the SHARED
#      loopback, not to `http://dsh:3080` over the proxy network.
#
# Required SERVICE_ENV values (GitHub secret): TS_AUTHKEY, DEEPSEEK_API_KEY,
# DSH_TRUSTED_HOST (= dsh.<tailnet>.ts.net — must equal the hostname browsers
# use, or the /api browser-trust fence rejects every request).
# Optional: TS_HOSTNAME (MagicDNS hostname, default `dsh`).
#
# Volumes: dsh-data -> /data ($DSH_HOME: sessions, settings.yaml, credentials,
# web profile, storages) and dsh-workspaces -> /workspaces (agent cwd).
# Both survive updates and restarts.

services:
  dsh:
    image: ghcr.io/kegenguyll/dsh:${TAG}
    restart: unless-stopped
    env_file: .env
    network_mode: service:tailscale
    depends_on:
      - tailscale
    volumes:
      - dsh-data:/data
      - dsh-workspaces:/workspaces
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3080/').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  tailscale:
    image: tailscale/tailscale:latest
    hostname: ${TS_HOSTNAME:-dsh} # MagicDNS: <hostname>.<tailnet>.ts.net
    restart: unless-stopped
    environment:
      - TS_AUTHKEY=${TS_AUTHKEY}
      - TS_STATE_DIR=/var/lib/tailscale
      - TS_SERVE_CONFIG=/config/serve.json
      - TS_USERSPACE=false
      - TS_ENABLE_HEALTH_CHECK=true
      - TS_LOCAL_ADDR_PORT=127.0.0.1:41234
      - TS_AUTH_ONCE=true
    configs:
      - source: ts-serve
        target: /config/serve.json
    volumes:
      - ts-state:/var/lib/tailscale # persists the node identity across restarts
    devices:
      - /dev/net/tun:/dev/net/tun
    cap_add:
      - net_admin
    networks:
      - proxy
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:41234/healthz"]
      interval: 1m
      timeout: 10s
      retries: 3
      start_period: 10s

# Serve config: terminate HTTPS on the tailnet :443 and proxy to the dsh app
# on the shared loopback (see the note at the top). `${TS_CERT_DOMAIN}` is
# filled in by the container at runtime (the MagicDNS FQDN).
configs:
  ts-serve:
    content: |
      {"TCP":{"443":{"HTTPS":true}},
       "Web":{"$${TS_CERT_DOMAIN}:443":{"Handlers":{"/":{"Proxy":"http://127.0.0.1:3080"}}}},
       "AllowFunnel":{"$${TS_CERT_DOMAIN}:443":false}}

networks:
  proxy:
    external: true

volumes:
  dsh-data:
  dsh-workspaces:
  ts-state:

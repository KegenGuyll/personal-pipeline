name: pipeline

# Bootstrap + run compose for the deploy agent and nginx.
# Values are interpolated from `stack/.env` (see `.env.example`).
#
# First run (manual bootstrap):
#   docker network create proxy
#   cp stack/.env.example stack/.env   # then fill it in
#   docker compose -f stack/docker-compose.yml up -d --build

services:
  agent:
    build:
      context: ../deploy-agent
    image: ghcr.io/${GHCR_OWNER:-CHANGE_ME}/deploy-agent:${AGENT_TAG:-latest}
    restart: unless-stopped
    environment:
      WEBHOOK_SECRET: ${WEBHOOK_SECRET}
      SERVICES_DIR: /services
      ALLOWED_IMAGE_PREFIXES: ${ALLOWED_IMAGE_PREFIXES:-ghcr.io/}
      GHCR_USER: ${GHCR_USER:-}
      GHCR_TOKEN: ${GHCR_TOKEN:-}
      GHCR_OWNER: ${GHCR_OWNER:-}
      PORT: "8080"
      DATA_DIR: /data
      LOG_RETENTION: ${LOG_RETENTION:-100}
      READ_TOKEN: ${READ_TOKEN:-}
      ADMIN_TOKEN: ${ADMIN_TOKEN:-}
      GITHUB_APP_ID: ${GITHUB_APP_ID:-}
      GITHUB_APP_PRIVATE_KEY_B64: ${GITHUB_APP_PRIVATE_KEY_B64:-}
      GITHUB_APP_INSTALLATION_ID: ${GITHUB_APP_INSTALLATION_ID:-}
      PIPELINE_OWNER: ${PIPELINE_OWNER:-}
      PIPELINE_REF: ${PIPELINE_REF:-main}
      DEPLOY_WEBHOOK_URL: ${DEPLOY_WEBHOOK_URL:-}
      TS_AUTHKEY: ${TS_AUTHKEY:-}
      HOOK_TIMEOUT: ${HOOK_TIMEOUT:-60}
      NOTIFY_WEBHOOK_URLS: ${NOTIFY_WEBHOOK_URLS:-}
      NOTIFY_TEMPLATE: ${NOTIFY_TEMPLATE:-}
      NOTIFY_CONTENT_TYPE: ${NOTIFY_CONTENT_TYPE:-application/json}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ../services:/services
      - agent-data:/data
    networks:
      - proxy
    ports:
      - "${AGENT_PORT:-9090}:8080"   # all-interfaces: NPM / reverse proxy forwards to this
    expose:
      - "8080"                   # internal: dockerized nginx uses this

  nginx:
    profiles: ["docker-nginx"]   # opt-in: skip when you already run host nginx
    image: nginx:1.27-alpine
    restart: unless-stopped
    volumes:
      - ../nginx/conf.d:/etc/nginx/conf.d:ro
      - nginx-certs:/etc/nginx/certs:ro
    ports:
      - "80:80"
      - "443:443"
    depends_on:
      - agent
    networks:
      - proxy

networks:
  proxy:
    external: true

volumes:
  agent-data:
  nginx-certs:

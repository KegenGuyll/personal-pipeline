# Minimal placeholder so nginx starts cleanly before any vhost is configured.
# Replace/augment with your own vhosts (copy the *.conf.example templates).
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    location / {
        default_type text/plain;
        return 200 'personal-pipeline nginx is running.\n';
    }
}
